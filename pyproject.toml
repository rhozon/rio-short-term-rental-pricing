[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rio-short-term-rental-pricing"
version = "0.1.0"
description = "Short-term rental pricing in Rio de Janeiro from Inside Airbnb: hedonic prices, the price elasticity of stays in a listing panel with fixed effects and an instrument, and forward demand for New Year's Eve and Carnival."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Hermont Ozon" }]
dependencies = ["numpy>=1.26", "pandas>=2.1", "statsmodels>=0.14", "linearmodels>=6.0", "xgboost>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["strp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
